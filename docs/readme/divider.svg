<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="img" aria-label="">
  <defs>
    <linearGradient id="rainbow" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="0.2" stop-color="#db2777"/>
      <stop offset="0.4" stop-color="#f97316"/>
      <stop offset="0.55" stop-color="#facc15"/>
      <stop offset="0.72" stop-color="#10b981"/>
      <stop offset="0.86" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bar">
      <rect x="40" y="8" width="1120" height="8" rx="4"/>
    </clipPath>
  </defs>
  <rect x="40" y="8" width="1120" height="8" rx="4" fill="url(#rainbow)"/>
  <g clip-path="url(#bar)">
    <rect x="-220" y="0" width="200" height="24" fill="url(#shine)">
      <animate attributeName="x" values="1240;-220" dur="3.6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <circle cx="20" cy="12" r="6" fill="#3b82f6"/>
  <circle cx="1180" cy="12" r="6" fill="#6d28d9"/>
</svg>
